services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      # Usuário "admin" do Postgres
      POSTGRES_USER: ${POSTGRES_USER}
      # Senha do Postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expõe a porta do Postgres no seu computador
      # computador:container
      - ${POSTGRES_PORT}:5432
    volumes:
      # Guarda os dados fora do container, para não perder ao remover/recriar
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: